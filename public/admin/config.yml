backend:
  name: git-gateway
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

site_url: "https://cmcopenbible.netlify.app"
display_url: "https://cmcopenbible.netlify.app"
logo_url: ""

collections:
  - name: "site_content"
    label: "Site Content"
    files:
      - name: "team"
        label: "About Page Team"
        file: "content/team.json"
        format: "json"
        fields:
          - label: "Team Members"
            name: "team"
            widget: "list"
            summary: "{{fields.name}} — {{fields.region}}"
            fields:
              - { label: "Region", name: "region", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Picture", name: "image", widget: "image", required: false }
              - { label: "Picture Focus — Left/Right", name: "imagePositionX", widget: "number", value_type: "int", min: 0, max: 100, step: 5, default: 50, hint: "50 centers the picture. Lower numbers move the visible area left; higher numbers move it right." }
              - { label: "Picture Focus — Up/Down", name: "imagePositionY", widget: "number", value_type: "int", min: 0, max: 100, step: 5, default: 30, hint: "Lower numbers move the visible area upward; higher numbers move it downward. Start around 30 for portraits." }

      - name: "events"
        label: "Events Page"
        file: "content/events.json"
        format: "json"
        fields:
          - label: "Events"
            name: "events"
            widget: "list"
            summary: "{{fields.title}} — {{fields.date}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Display Date", name: "date", widget: "string", hint: "This is what visitors see, for example: May 25–27, 2027." }
              - { label: "Start Date", name: "startDate", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", hint: "Used for sorting events." }
              - { label: "End Date", name: "endDate", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", hint: "The event automatically disappears after this date." }
              - { label: "Location", name: "location", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Button Text", name: "buttonText", widget: "string", default: "Learn More" }
              - { label: "Button URL", name: "buttonUrl", widget: "string", required: false }
              - { label: "Featured", name: "featured", widget: "boolean", default: false }

      - name: "resources"
        label: "Resources Page"
        file: "content/resources.json"
        format: "json"
        fields:
          - { label: "Hero Eyebrow", name: "heroEyebrow", widget: "string" }
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Description", name: "heroDescription", widget: "text" }
          - { label: "Featured Section Title", name: "featuredTitle", widget: "string" }
          - { label: "Featured Section Description", name: "featuredDescription", widget: "text" }
          - label: "Resource Cards"
            name: "resources"
            widget: "list"
            summary: "{{fields.title}} — {{fields.category}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Category", name: "category", widget: "string", required: false, hint: "Examples: Guide, Pathway, Video, Download, Assessment." }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Button Text", name: "buttonText", widget: "string", default: "View Resource" }
              - { label: "Button URL", name: "buttonUrl", widget: "string", required: false }
              - { label: "Featured", name: "featured", widget: "boolean", default: false, hint: "Featured cards appear in the larger Start Here section." }

      - name: "models"
        label: "Church Models"
        file: "content/models.json"
        format: "json"
        fields:
          - label: "Models"
            name: "models"
            widget: "list"
            summary: "{{fields.title}} — {{fields.movement}}"
            fields:
              - { label: "Model Name", name: "title", widget: "string" }
              - { label: "Movement Phrase", name: "movement", widget: "string", hint: "Three short actions separated by dots, for example: Gather · Launch · Establish." }
              - { label: "Summary", name: "summary", widget: "text" }
              - { label: "Best Suited For", name: "bestSuitedFor", widget: "text" }
              - { label: "What Strengthens It", name: "whatStrengthensIt", widget: "text" }

      - name: "discern"
        label: "Discernment Center"
        file: "content/discern.json"
        format: "json"
        fields:
          - { label: "Application Button Link", name: "applicationUrl", widget: "string" }
          - { label: "Dates", name: "dates", widget: "string" }
          - { label: "Location", name: "location", widget: "string" }
          - { label: "Hero Eyebrow", name: "heroEyebrow", widget: "string" }
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Description", name: "heroDescription", widget: "text" }
          - { label: "What to Expect Title", name: "whatToExpectTitle", widget: "string" }
          - { label: "What to Expect Paragraph One", name: "whatToExpectParagraphOne", widget: "text" }
          - { label: "What to Expect Paragraph Two", name: "whatToExpectParagraphTwo", widget: "text" }
